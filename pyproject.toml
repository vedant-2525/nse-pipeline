[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-pipeline"
version = "0.1.0"
description = "Batch data pipeline for Indian stock market end-of-day data (NSE)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data Engineer" }
]
dependencies = [
    "requests>=2.32.0",
    "yfinance>=0.2.50",
    "pyspark>=3.5.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.30",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort imports
    "UP",  # pyupgrade modern python syntax
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
