# Pipeline Configuration Settings

pipeline:
  name: "nse-market-data-pipeline"
  timezone: "Asia/Kolkata"

storage:
  bronze_path: "data/bronze"
  silver_path: "data/silver"
  quarantine_path: "data/quarantine"

ingest:
  # Polite delays and retries to respect NSE servers
  request_delay_seconds: 2.0
  max_retries: 5
  backoff_factor: 2.0
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
  timeout_seconds: 30

filter:
  # When true, only symbols listed in config/symbols.yaml are retained
  # Set to false to process all equity symbols in the bhavcopy
  filter_by_symbol_universe: true
  series: "EQ"

backfill:
  default_start_date: "2023-01-01"
  default_end_date: "2024-12-31"

quality:
  min_expected_symbol_pct: 0.90
  max_daily_move_warn_pct: 0.20
  max_null_rate_warn_pct: 0.05
  max_reject_rate_pct: 2.0
